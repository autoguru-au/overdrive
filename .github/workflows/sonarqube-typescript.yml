# Vendored copy of autoguru-au/devsecops/.github/workflows/sonarqube-typescript.yml@f3f1f1cf54a1e637b5d8097ed7e9b1c49bd4d162 (COM-108).
# devsecops is private and GitHub does not let public repositories call its reusable workflows.
name: SonarQube Analysis (TypeScript)

on:
  workflow_call:
    inputs:
      enable_tests:
        required: false
        type: boolean
        default: true
      package_manager:
        required: false
        type: string
        default: 'yarn'
    secrets:
      SONAR_HOST_URL:
        required: true
      SONAR_TOKEN:
        required: true

jobs:
  sonarqube:
    name: Analyze TypeScript with SonarQube
    runs-on: ubuntu-latest
    env:
      TZ: Australia/Brisbane
      CI: true

    steps:
      # Checkout Repository
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Detect Node.js version from package.json
      - name: Get Node.js version from package.json
        id: node_version
        run: |
          NODE_VERSION=$(jq -r '.volta.node' package.json)
          if [ -z "$NODE_VERSION" ]; then
            echo "Error: No Node.js version found in package.json under .volta.node"
            exit 1
          fi
          echo "NODE_VERSION=$NODE_VERSION" >> $GITHUB_ENV

      # Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          check-latest: true

      # Install dependencies
      - name: Install Dependencies
        run: |
          if [ "${{ inputs.package_manager }}" = "bun" ]; then
            curl -fsSL https://bun.sh/install | bash
            export PATH="$HOME/.bun/bin:$PATH"
            bun install --frozen-lockfile
          else
            yarn install --immutable --check-cache
          fi

      # Run Tests (if enabled)
      - name: Run Tests with Coverage
        if: inputs.enable_tests == true
        run: |
          if ${{ inputs.package_manager == 'bun' && 'bun run test:ci' || 'yarn test:ci' }}; then
            echo "TESTS_PASSED=true" >> $GITHUB_ENV
          else
            echo "Tests failed, skipping coverage..."
            echo "TESTS_PASSED=false" >> $GITHUB_ENV
          fi

      # Fix lcov paths for SonarQube (only if tests ran)
      - name: Fix lcov paths
        if: env.TESTS_PASSED == 'true'
        run: |
          echo "Fixing paths in lcov.info..."
          sed -i 's#\.\./##g' coverage/lcov.info
          echo "Fixed lcov.info paths:"
          head -n 20 coverage/lcov.info || true

      # Install Sonar Scanner. @sonar/scan downloads the JRE the server requires
      # (Java 21+ since the 2026-08 server upgrade); the legacy `sonar-scanner` npm
      # package ran on the runner's Java 17 and failed at startup.
      - name: Install Sonar Scanner
        run: npm install -g @sonar/scan@4.4.0

      # Start SonarQube Analysis. The scanner reads SONAR_HOST_URL and SONAR_TOKEN from
      # the environment, so the token is no longer interpolated into the command line.
      # projectName is pinned because @sonar/scan otherwise takes it from package.json.
      - name: Run SonarQube Analysis
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          SONAR_CMD="sonar-scanner -Dsonar.projectKey='${{ github.event.repository.name }}' \
            -Dsonar.projectName='${{ github.event.repository.name }}' \
            -Dsonar.sourceEncoding=UTF-8 \
            -Dsonar.exclusions='**/node_modules/**,**/stories/**,**/*.stories.tsx'"

          if [ "$TESTS_PASSED" == "true" ]; then
            SONAR_CMD="$SONAR_CMD -Dsonar.javascript.lcov.reportPaths=coverage/lcov.info"
          fi

          eval $SONAR_CMD
